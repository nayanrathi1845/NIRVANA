name: Build NIRVANA app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk NIRVANA.apk

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: NIRVANA-apk
          path: NIRVANA.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NIRVANA build ${{ github.run_number }}
          body: Download NIRVANA.apk below and open it on your Android phone.
          files: NIRVANA.apk
          make_latest: true
