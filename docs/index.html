<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NIRVANA</title>
<meta name="description" content="Scroll less, live more. A three-friend league for cutting Instagram time.">
<meta name="theme-color" content="#0F151B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NIRVANA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one column scoreboard app — league header, date strip, tabbed panels (Log / Standings / Players / Rules) */
:root{
  --bg:#EAEEF1; --surface:#FFFFFF; --sunk:#F3F5F7; --ink:#14202B; --muted:#5A6774; --line:#D3DAE0;
  --accent:#2B55E0; --accent-soft:#E3E9FC; --accent-ink:#FFFFFF;
  --gold:#B87A0B; --gold-soft:#FBF0D9; --good:#1C8455; --good-soft:#DDF2E7; --bad:#BF3838; --bad-soft:#F8E1E1;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151B; --surface:#17202A; --sunk:#121A22; --ink:#E4EAF0; --muted:#92A0AD; --line:#283440;
  --accent:#7D9BFF; --accent-soft:#1E2A4A; --accent-ink:#0B1020;
  --gold:#E9B64C; --gold-soft:#3A2E14; --good:#4DC48B; --good-soft:#15322A; --bad:#F07474; --bad-soft:#3A1C1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F151B; --surface:#17202A; --sunk:#121A22; --ink:#E4EAF0; --muted:#92A0AD; --line:#283440;
  --accent:#7D9BFF; --accent-soft:#1E2A4A; --accent-ink:#0B1020;
  --gold:#E9B64C; --gold-soft:#3A2E14; --good:#4DC48B; --good-soft:#15322A; --bad:#F07474; --bad-soft:#3A1C1F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:800 clamp(26px,5vw,38px)/1.05 var(--display);letter-spacing:-.02em;margin:0;text-wrap:balance}
.stake{margin:4px 0 0;color:var(--muted);font-size:14px}
.datebar{display:flex;align-items:center;gap:6px}
.datebar input{font:500 14px var(--mono)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,label.tog:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.icon{padding:8px 10px;font-family:var(--mono)}
button:disabled{opacity:.5;cursor:not-allowed}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);font-weight:700;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:460px){nav.tabs button{padding:10px 9px;font-size:14px}}
.notice{background:var(--gold-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px}
.panel{display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
h2{font:700 20px/1.2 var(--display);margin:0;letter-spacing:-.01em}
h3{font:700 13px/1.2 var(--body);margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-weight:700;font-size:14px}
.hint{color:var(--muted);font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stepper{display:flex;align-items:center;gap:6px}
.stepper output{min-width:2ch;text-align:center;font:700 18px var(--mono)}
label.tog{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sunk);cursor:pointer}
label.tog input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.preview{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-size:14px}
.preview .num{text-align:right}
.preview .tot{font:800 28px var(--display);grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;margin-top:6px}
.neg{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;background:none;padding:8px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.board{display:flex;flex-direction:column;gap:8px}
.rank{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rank.win{border-color:var(--gold);background:var(--gold-soft)}
.rank .pos{font:800 22px var(--display);color:var(--muted);text-align:center}
.rank.win .pos{color:var(--gold)}
.rank .who{min-width:0}
.rank .name{font-weight:700;font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rank .meta{color:var(--muted);font-size:13px}
.rank .score{font:800 26px var(--display);font-variant-numeric:tabular-nums;text-align:right}
.rank .score small{display:block;font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-block;font:700 11px/1 var(--body);text-transform:uppercase;letter-spacing:.07em;padding:4px 7px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pill.gold{background:var(--gold);color:var(--surface)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
td.cell{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.hi{background:var(--good-soft);color:var(--good);font-weight:700}
td.lo{color:var(--muted)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font:700 18px var(--display);margin-bottom:6px}
.player{display:grid;grid-template-columns:minmax(0,1fr) 110px 110px auto;gap:10px;align-items:end;padding-block:10px;border-bottom:1px solid var(--line)}
.player:last-child{border-bottom:0}
@media (max-width:560px){.player{grid-template-columns:1fr 1fr}.player .pname{grid-column:1/-1}}
.rules{display:flex;flex-direction:column;gap:10px}
.rules table td{text-align:left;vertical-align:top}
.rules table td:last-child{text-align:right;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.rank{transition:transform .2s}.rank:hover{transform:translateY(-1px)}}


.auth{max-width:440px;margin-inline:auto;width:100%}
.err{margin:0;color:var(--bad);font-size:14px}
.linkish{border:0;background:none;color:var(--accent);padding:4px 0;font-weight:700;text-align:left}
.totlbl{font:700 14px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.whoami{font-size:13px;color:var(--muted)}
.whoami b{color:var(--ink)}
form.panel{gap:14px}
form .primary{padding-block:12px}
@media (display-mode: standalone){.wrap{padding-block:12px 40px}}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>NIRVANA</h1>
      <p class="stake">Weekly loser buys chai. Monthly loser plans the offline outing.</p>
    </div>
  </header>

  <div id="notice" class="notice" hidden></div>
  <main id="gate" class="panel"><div class="card empty"><strong>Opening NIRVANA…</strong></div></main>

  <div id="shell" class="panel" hidden>
    <div class="row" style="justify-content:space-between">
      <span class="whoami">Playing as <b id="who"></b></span>
      <div class="datebar" aria-label="Choose date">
        <button class="icon" id="prevDay" aria-label="Previous day">&larr;</button>
        <input type="date" id="dateInput" aria-label="Date">
        <button class="icon" id="nextDay" aria-label="Next day">&rarr;</button>
        <button class="ghost" id="todayBtn">Today</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-log" data-tab="log">Log a day</button>
      <button role="tab" id="tab-standings" data-tab="standings">Standings</button>
      <button role="tab" id="tab-profile" data-tab="profile">Profile</button>
      <button role="tab" id="tab-rules" data-tab="rules">Rules</button>
    </nav>
    <main id="view" class="panel"></main>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script type="module">
import { start } from "./app.js?v=1";
let backend = window.__mockBackend;
if (!backend) {
  try {
    const m = await import("./backend.js?v=1");
    backend = await m.makeBackend();
  } catch (e) {
    document.getElementById("gate").innerHTML = '<div class="card empty"><strong>Can\'t reach NIRVANA</strong>Check your connection and reload the page.</div>';
    throw e;
  }
}
start(backend);
</script>
</body>
</html>
